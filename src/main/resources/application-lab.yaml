spring:
  datasource:
    url: ${GRH_DB_URL:jdbc:postgresql://localhost:5432/gestion_paiement_lab}
    driver-class-name: org.postgresql.Driver
    username: ${GRH_DB_USERNAME:postgres}
    password: ${GRH_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  app:
    security :
      token-duration-hours: 10
