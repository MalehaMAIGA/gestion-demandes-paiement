spring:
  application:
    name: gestion-demandes-paiement
  datasource:
    url: ${GRH_DB_URL:jdbc:postgresql://localhost:5432/gestion_paiement_lab}
    driver-class-name: org.postgresql.Driver
    username: ${GRH_DB_USERNAME:postgres}
    password: ${GRH_DB_PASSWORD}

  profiles:
    active:
      - ${SPRING_PROFILES_ACTIVE:lab}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8082
tresor:

  demande-paiement:
    plafond: ${TRESOR_PLAFOND_PAIEMENT:10000000}
  auth:
    token:
      validity: ${TRESOR_TOKEN_VALIDITY:10}
